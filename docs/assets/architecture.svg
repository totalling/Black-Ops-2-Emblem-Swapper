<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="560" fill="#000000"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#71717a"/>
    </marker>
  </defs>

  <text x="600" y="46" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="2" text-anchor="middle">HOW TRAFFIC FLOWS</text>
  <text x="600" y="72" fill="#71717a" font-size="14" text-anchor="middle">the proxy sits on your PC, between the console and the internet</text>

  <g stroke-width="2" fill="none">
    <line x1="260" y1="315" x2="430" y2="315" stroke="#ffffff" marker-end="url(#arrow)"/>
    <line x1="770" y1="315" x2="940" y2="195" stroke="#ffffff" marker-end="url(#arrow)"/>
    <line x1="770" y1="315" x2="940" y2="445" stroke="#71717a" stroke-dasharray="2 6" marker-end="url(#arrowmuted)"/>
  </g>

  <text x="345" y="300" fill="#71717a" font-size="12" text-anchor="middle">same network</text>

  <rect x="810" y="244" width="90" height="22" rx="4" fill="#000000"/>
  <text x="855" y="259" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">inspected</text>

  <rect x="787" y="369" width="136" height="22" rx="4" fill="#000000"/>
  <text x="855" y="384" fill="#71717a" font-size="12.5" text-anchor="middle">untouched, encrypted</text>

  <g>
    <rect x="60" y="255" width="200" height="120" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="160" y="308" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">PS5</text>
    <text x="160" y="333" fill="#a1a1aa" font-size="12.5" text-anchor="middle">network settings point</text>
    <text x="160" y="350" fill="#a1a1aa" font-size="12.5" text-anchor="middle">at your PC's IP</text>
  </g>

  <g>
    <rect x="430" y="175" width="340" height="280" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="600" y="216" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">YOUR PC</text>
    <text x="600" y="239" fill="#a1a1aa" font-size="12.5" text-anchor="middle">emblem swapper proxy</text>
    <line x1="454" y1="258" x2="746" y2="258" stroke="#27272a" stroke-width="1"/>

    <text x="600" y="284" fill="#71717a" font-size="10.5" letter-spacing="2" text-anchor="middle">MODE</text>

    <g font-size="13">
      <g>
        <rect x="454" y="298" width="89" height="112" rx="6" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
        <text x="498.5" y="330" fill="#ffffff" font-weight="700" text-anchor="middle">Off</text>
        <text x="498.5" y="352" fill="#71717a" font-size="11" text-anchor="middle">passthrough,</text>
        <text x="498.5" y="367" fill="#71717a" font-size="11" text-anchor="middle">nothing touched</text>
      </g>
      <g>
        <rect x="555.5" y="298" width="89" height="112" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <text x="600" y="330" fill="#ffffff" font-weight="700" text-anchor="middle">Capture</text>
        <text x="600" y="352" fill="#a1a1aa" font-size="11" text-anchor="middle">saves the real</text>
        <text x="600" y="367" fill="#a1a1aa" font-size="11" text-anchor="middle">response</text>
      </g>
      <g>
        <rect x="657" y="298" width="89" height="112" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <text x="701.5" y="330" fill="#ffffff" font-weight="700" text-anchor="middle">Show</text>
        <text x="701.5" y="352" fill="#a1a1aa" font-size="11" text-anchor="middle">swaps in your</text>
        <text x="701.5" y="367" fill="#a1a1aa" font-size="11" text-anchor="middle">selected emblem</text>
      </g>
    </g>

    <text x="600" y="432" fill="#52525b" font-size="11.5" text-anchor="middle">one mode is active at a time</text>
  </g>

  <g>
    <rect x="940" y="140" width="220" height="110" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="1050" y="178" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">DEMONWARE</text>
    <text x="1050" y="201" fill="#a1a1aa" font-size="12.5" text-anchor="middle">emblem-slot endpoint</text>
    <text x="1050" y="218" fill="#a1a1aa" font-size="12.5" text-anchor="middle">plain HTTP, one path</text>
  </g>

  <g>
    <rect x="940" y="390" width="220" height="110" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="1050" y="428" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">EVERYTHING ELSE</text>
    <text x="1050" y="451" fill="#a1a1aa" font-size="12.5" text-anchor="middle">PSN sign-in, matchmaking,</text>
    <text x="1050" y="468" fill="#a1a1aa" font-size="12.5" text-anchor="middle">game data &#8212; all HTTPS</text>
  </g>

  <text x="600" y="530" fill="#71717a" font-size="12.5" text-anchor="middle">only requests matching a player's saved emblem slot are ever touched &#8212; everything else passes straight through</text>
</svg>
